---
- name: Create a .dwm directory if it does not exist
  file:
    path: ~/.dwm
    state: directory
    mode: '0755'

- name: Copy dwm config files to ~/.dwm/
  command: cp -r {{ role_path }}/files/{{ item }} ~/.dwm
  with_items:
   - "autostart.sh"

- name: Create an xsessions directory if it does not exist
  file:
    path: /usr/share/xsessions 
    state: directory
    mode: '0755'
  become: true

- name: Copy dwm.desktop config files to /usr/share/xsessions
  command: cp -r {{ role_path }}/files/{{ item }} ~/.dwm
  with_items:
   - "dwm.desktop"
