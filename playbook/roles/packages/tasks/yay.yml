---
- name: Create aur_builder user
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel
  become: true

- name: Setup password-less pacman use via sudo for aur_builder user
  ansible.builtin.lineinfile: 
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: true
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

- name: Install yay using makepkg
  kewlfft.aur.aur:
    name: yay-bin
    use: makepkg
    state: present
  become: true
  become_user: aur_builder

- name: Install AUR packages using yay
  kewlfft.aur.aur:
    name: "{{ yay_packages }}"
    use: yay
    state: present
  become: true
  become_user: aur_builder
